<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
  name="description"
  content="Vex, the only client you'll ever need."
/>

<link rel="icon" type="image/png" href="/assets/image_2026-06-09_005610247.png" />

<title>Vex Client</title>
    <title>Vex Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-shell">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>

      <aside class="sidebar">
        <button class="brand" type="button" aria-label="Vex home">
          <img class="brand-mark" src="assets/vex.gif" alt="" />
          <span>VEX</span>
        </button>

        <nav class="main-nav" aria-label="Primary navigation">
          <button class="nav-item active" data-view="Home">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9Z" />
              </svg>
            </span>
            <span>Home</span>
          </button>
          <button class="nav-item" data-view="Modules">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="7" height="7" rx="1" />
                <rect x="14" y="4" width="7" height="7" rx="1" />
                <rect x="3" y="15" width="7" height="6" rx="1" />
                <rect x="14" y="15" width="7" height="6" rx="1" />
              </svg>
            </span>
            <span>Modules</span>
            <span class="nav-count">24</span>
          </button>
          <button class="nav-item" data-view="Configs">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="m15.5 8.5-2 5-5 2 2-5 5-2Z" />
              </svg>
            </span>
            <span>Configs</span>
          </button>
        </nav>

        <div class="sidebar-spacer"></div>

        <nav class="utility-nav" aria-label="Launcher options">
          <button class="nav-item" data-view="Settings">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V21h-4v-.08a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3v-4h.08a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3h4v.08a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21v4h-.08a1.7 1.7 0 0 0-1.52 1Z" />
              </svg>
            </span>
            <span>Settings</span>
          </button>
        </nav>

        <button class="profile">
          <span class="avatar" id="active-account-avatar">S</span>
          <span class="profile-copy">
            <strong>Steve</strong>
            <small>Microsoft account</small>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </aside>

      <main>
        <header class="topbar">
          <button class="mobile-menu" aria-label="Open navigation">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
          <div class="topbar-actions">
            <button class="icon-button" id="notifications-button" aria-label="Notifications">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
              </svg>
              <span class="notification"></span>
            </button>
            <button class="window-button" id="minimize-button" aria-label="Minimize window"></button>
            <button class="window-button close" id="close-button" aria-label="Close window"></button>
          </div>
        </header>

        <section class="content" id="view-content">
          <div class="welcome">
            <div>
              <h1>Ready when you are.</h1>
            </div>
          </div>

          <article class="hero-card">
            <div class="hero-grid"></div>
            <button class="voxel-scene vex-trigger" aria-label="Animate Vex">
              <img class="client-emblem" src="assets/vex.gif" alt="" />
            </button>
            <div class="hero-content">
              <h2>Vex<span>.</span></h2>
              <p>Minecraft 1.21.5 <span>&bull;</span> <b id="hero-module-count">24</b> modules enabled</p>
              <div class="hero-actions">
                <button class="play-button" id="play-button">
                  <span class="play-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="m9 7 8 5-8 5V7Z" />
                    </svg>
                  </span>
                  <span class="play-copy">
                    <strong>LAUNCH CLIENT</strong>
                    <small>Default profile</small>
                  </span>
                  <span class="keycap">ENTER</span>
                </button>
                <button class="more-button" id="client-options-button" aria-label="Client options">
                  <span></span><span></span><span></span>
                </button>
              </div>
              <div class="launch-progress" aria-hidden="true">
                <span></span>
              </div>
            </div>
          </article>

          <div class="section-heading">
            <div>
              <h3>Choose a setup</h3>
            </div>
            <button class="text-button" data-action="manage-configs">
              Manage configs
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 18 6-6-6-6" />
              </svg>
            </button>
          </div>

          <div class="instance-grid">
            <button class="instance-card" data-instance="Default">
              <div class="instance-art creative">
                <span class="mini-block one"></span>
                <span class="mini-block two"></span>
                <span class="mini-block three"></span>
                <span class="profile-glyph">D</span>
                <span class="instance-number">01</span>
              </div>
              <div class="instance-info">
                <div>
                  <strong>Default</strong>
                  <span>Balanced &middot; 24 modules</span>
                </div>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7 8 5-8 5V7Z" /></svg>
              </div>
            </button>

            <button class="instance-card" data-instance="Movement">
              <div class="instance-art modded">
                <span class="profile-glyph">M</span>
                <span class="instance-number">02</span>
              </div>
              <div class="instance-info">
                <div>
                  <strong>Movement</strong>
                  <span>Speed &middot; Utility</span>
                </div>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7 8 5-8 5V7Z" /></svg>
              </div>
            </button>

            <button class="add-card" data-action="new-profile">
              <span class="add-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
              </span>
              <strong>New profile</strong>
              <small>Create a config</small>
            </button>
          </div>

        </section>
      </main>
    </div>

    <div class="toast" role="status" aria-live="polite">
      <span class="toast-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7 8 5-8 5V7Z" /></svg>
      </span>
      <div>
        <strong>Loading Default</strong>
        <small>Preparing Vex client...</small>
      </div>
    </div>

    <div class="popover" id="notifications-popover" aria-hidden="true">
      <div class="popover-heading">
        <strong>Notifications</strong>
        <button data-action="clear-notifications">Clear</button>
      </div>
      <div class="notice-item">
        <span class="status-dot"></span>
        <div><strong>Vex is ready</strong><small>Client files are up to date.</small></div>
      </div>
    </div>

    <div class="popover options-popover" id="options-popover" aria-hidden="true">
      <button data-action="open-folder">Open client folder</button>
      <button data-action="repair-client">Verify client files</button>
      <button data-action="open-settings">Launch settings</button>
    </div>

    <div class="popover profile-popover" id="profile-popover" aria-hidden="true">
      <div class="popover-heading"><strong>Accounts</strong></div>
      <button class="account-option active" data-account="Steve" data-avatar="">
        <span class="account-initial">S</span><span><strong>Steve</strong><small>Active</small></span>
      </button>
      <button class="account-option" data-account="Haso" data-avatar="assets/haso.png">
        <img src="assets/haso.png" alt="" /><span><strong>Haso</strong><small>Demo account</small></span>
      </button>
      <button class="account-option" data-account="ueua" data-avatar="assets/ueua.png">
        <img src="assets/ueua.png" alt="" /><span><strong>ueua</strong><small>Demo account</small></span>
      </button>
      <button data-action="copy-uuid">Copy profile ID</button>
      <button data-action="sign-out">Sign out</button>
    </div>

    <div class="modal-backdrop" id="modal-backdrop" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <div>
            <h2 id="modal-title">New profile</h2>
          </div>
          <button class="modal-close" data-action="close-modal" aria-label="Close dialog">&times;</button>
        </div>
        <form id="profile-form">
          <label>
            Profile name
            <input id="profile-name" name="profileName" placeholder="My config" maxlength="20" required />
          </label>
          <label>
            Starting point
            <select id="profile-base" name="profileBase">
              <option>Default</option>
              <option>Movement</option>
              <option>Blank</option>
            </select>
          </label>
          <div class="modal-actions">
            <button type="button" class="secondary-button" data-action="close-modal">Cancel</button>
            <button type="submit" class="primary-button">Create profile</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
